name: CI Pipeline

'on':
  push:
    branches: [ main, master, develop, auth, 'feat/**', 'fix/**' ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  lint-and-validate:
    name: Lint & Structure Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Validation & Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML flake8

      - name: Validate Workflow YAML Files
        run: |
          python -c "
          import yaml, glob, sys
          yaml_files = sorted(glob.glob('.github/workflows/*.yml') + glob.glob('.github/workflows/*.yaml'))
          errors = 0
          for yf in yaml_files:
              try:
                  with open(yf, 'r', encoding='utf-8') as f:
                      content = yaml.safe_load(f)
                      if not content or 'jobs' not in content:
                          raise ValueError('Missing jobs or empty workflow definition')
                  print(f'✓ Valid YAML: {yf}')
              except Exception as e:
                  print(f'✗ Invalid YAML: {yf}: {e}', file=sys.stderr)
                  errors += 1
          if errors > 0:
              sys.exit(1)
          print(f'All {len(yaml_files)} workflow files validated successfully.')
          "

      - name: Lint Python Code (Flake8)
        run: |
          # Check for Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.git,__pycache__,venv,.venv,node_modules
          
          # Report warnings with exit-zero for non-blocking style guidance
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics --exclude=.git,__pycache__,venv,.venv,node_modules

      - name: Check for Untracked Sensitive Filenames
        run: |
          echo "Scanning git-tracked files for forbidden secret filenames..."
          # Match forbidden filenames (.env, .pem, .key, id_rsa, credentials.json)
          # Explicitly permit benign template files (.env.example, .env.sample, .env.template)
          TRACKED_LEAKS=$(git ls-files | grep -v -E '\.env\.(example|sample|template)$' | grep -E '(^|/)(\.env(\..+)?|.*\.pem|.*\.key|.*id_rsa.*|.*credentials\.json)$' || true)
          if [ -n "$TRACKED_LEAKS" ]; then
            echo "SECURITY ERROR: Sensitive file(s) tracked in git repository:"
            echo "$TRACKED_LEAKS"
            exit 1
          fi
          echo "✓ No sensitive credentials or environment files tracked in git."

  secret-scan:
    name: Secret & Credential Leak Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Detector
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_NOTIFY_USER_ISSUE: false

      - name: Verify No High-Risk Secret Tokens in Code
        run: |
          echo "Running content regex scan for Nova and Razorpay secret keys..."
          FOUND=0
          # Scan tracked files (excluding docs and .gitleaks.toml) for active Nova and Razorpay secrets
          for file in $(git ls-files | grep -v -E '^(docs/|\.gitleaks\.toml)'); do
            if grep -E 'nova_sk_[A-Za-z0-9_\-]{43}' "$file" 2>/dev/null | grep -v 'nova_sk_REPLACE_ME'; then
              echo "CRITICAL: Live Nova API key found in $file!"
              FOUND=1
            fi
            if grep -E 'rzp_(test|live)_[A-Za-z0-9]{10,}' "$file" 2>/dev/null | grep -v 'rzp_test_REPLACE_ME'; then
              echo "CRITICAL: Live Razorpay key found in $file!"
              FOUND=1
            fi
          done
          if [ $FOUND -ne 0 ]; then
            echo "Security scan failed: Live API credentials detected!"
            exit 1
          fi
          echo "✓ No credential token leaks detected in codebase."

  test-python:
    name: Python Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi
          if [ -f ai/requirements.txt ]; then
            echo "Installing AI service dependencies..."
            pip install -r ai/requirements.txt
          fi
          pip install pytest pytest-cov

      - name: Run Pytest Test Suite with Coverage
        run: |
          TEST_DIRS=""
          if [ -d tests ]; then TEST_DIRS="$TEST_DIRS tests"; fi
          if [ -d ai/tests ]; then TEST_DIRS="$TEST_DIRS ai/tests"; elif [ -d ai ]; then TEST_DIRS="$TEST_DIRS ai"; fi
          
          if [ -n "$TEST_DIRS" ]; then
            pytest $TEST_DIRS -v --tb=short --durations=10
          else
            echo "No test directory found yet; running baseline smoke validation."
            python -c "print('Baseline runtime validation passed on Python ${{ matrix.python-version }}')"
          fi

  test-node:
    name: Node.js Test Suite (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18.x", "20.x", "22.x"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect Node.js Projects
        id: check_node
        run: |
          NODE_DIRS=""
          for d in . web api; do
            if [ -f "$d/package.json" ]; then
              NODE_DIRS="$NODE_DIRS $d"
            fi
          done
          if [ -n "$NODE_DIRS" ]; then
            echo "has_node=true" >> "$GITHUB_OUTPUT"
            echo "node_dirs=$NODE_DIRS" >> "$GITHUB_OUTPUT"
            echo "Found Node.js project(s) in:$NODE_DIRS"
          else
            echo "has_node=false" >> "$GITHUB_OUTPUT"
            echo "No Node.js packages detected."
          fi

      - name: Set up Node.js ${{ matrix.node-version }}
        if: steps.check_node.outputs.has_node == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Node Dependencies
        if: steps.check_node.outputs.has_node == 'true'
        run: |
          for d in ${{ steps.check_node.outputs.node_dirs }}; do
            echo "=== Installing dependencies in $d ==="
            (cd "$d" && if [ -f package-lock.json ]; then npm ci; else npm install; fi)
          done

      - name: Run Node Linter
        if: steps.check_node.outputs.has_node == 'true'
        run: |
          for d in ${{ steps.check_node.outputs.node_dirs }}; do
            (cd "$d" && if npm run | grep -q "lint"; then npm run lint; fi)
          done

      - name: Run Node Tests
        if: steps.check_node.outputs.has_node == 'true'
        run: |
          for d in ${{ steps.check_node.outputs.node_dirs }}; do
            (cd "$d" && if npm run | grep -q "test"; then npm test; fi)
          done

      - name: Run Node Build
        if: steps.check_node.outputs.has_node == 'true'
        run: |
          for d in ${{ steps.check_node.outputs.node_dirs }}; do
            (cd "$d" && if npm run | grep -q "build"; then npm run build; fi)
          done

      - name: Skip Notification
        if: steps.check_node.outputs.has_node == 'false'
        run: |
          echo "No package.json detected across ., web, or api; skipping Node.js execution."

  security-audit:
    name: Security & Vulnerability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Python Dependency Audit
        run: |
          pip install pip-audit
          AUDITED=0
          for req in requirements.txt ai/requirements.txt; do
            if [ -f "$req" ]; then
              echo "Auditing dependencies in $req..."
              pip-audit -r "$req" || echo "::warning::pip-audit reported advisories on $req"
              AUDITED=1
            fi
          done
          if [ $AUDITED -eq 0 ]; then
            echo "No python requirements files found; skipping pip-audit."
          fi

      - name: Run NPM Security Audit
        run: |
          for pkg in package.json web/package.json api/package.json; do
            if [ -f "$pkg" ]; then
              dir=$(dirname "$pkg")
              echo "Running npm audit in $dir..."
              (cd "$dir" && npm audit --audit-level=high || echo "::warning::npm audit reported high severity advisories in $dir")
            fi
          done

  ci-gate:
    name: CI Pipeline Gate
    needs: [lint-and-validate, secret-scan, test-python, test-node, security-audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Pipeline Status
        run: |
          LINT="${{ needs.lint-and-validate.result }}"
          SECRETS="${{ needs.secret-scan.result }}"
          PYTEST="${{ needs.test-python.result }}"
          NODE="${{ needs.test-node.result }}"
          SECURITY="${{ needs.security-audit.result }}"
          
          echo "Pipeline results summary:"
          echo "  - lint-and-validate: $LINT"
          echo "  - secret-scan:       $SECRETS"
          echo "  - test-python:       $PYTEST"
          echo "  - test-node:         $NODE"
          echo "  - security-audit:    $SECURITY"
          
          if [ "$LINT" != "success" ] || [ "$SECRETS" != "success" ] || [ "$PYTEST" != "success" ] || [ "$NODE" != "success" ] || [ "$SECURITY" != "success" ]; then
            echo "ERROR: One or more CI stages failed or did not succeed!"
            exit 1
          fi
          
          echo "✓ All CI stages completed successfully. Gate is GREEN."
