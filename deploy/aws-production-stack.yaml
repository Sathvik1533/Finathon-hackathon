AWSTemplateFormatVersion: '2010-09-09'
Description: >
  FIN-11 LedgerSense | AWS Enterprise Production Cloud Topology
  Provisions AWS ECS Fargate, Application Load Balancer (ALB), Amazon S3 (Artifacts & Audits),
  Amazon DynamoDB (Distributed Locks), Amazon Bedrock IAM access, and CloudWatch Logging.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "1. Core Application Configuration"
        Parameters:
          - EnvironmentName
          - DatabaseUrl
          - JwtSecret
      - Label:
          default: "2. Amazon Bedrock & AI Services"
        Parameters:
          - BedrockModelId
      - Label:
          default: "3. ECS Fargate Compute Sizing"
        Parameters:
          - ContainerImage
          - DesiredCount
          - FargateCpu
          - FargateMemory

Parameters:
  EnvironmentName:
    Type: String
    Default: finathon-ledgersense
    Description: Prefix used to name provisioned cloud resources

  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: PostgreSQL connection string (Supabase or Amazon RDS with arbitrary precision NUMERIC)

  JwtSecret:
    Type: String
    NoEcho: true
    Description: JWT signing secret for API authentication

  BedrockModelId:
    Type: String
    Default: amazon.nova-pro-v1:0
    AllowedValues:
      - amazon.nova-pro-v1:0
      - amazon.nova-lite-v1:0
      - anthropic.claude-3-5-sonnet-20241022-v2:0
      - anthropic.claude-3-haiku-20240307-v1:0
    Description: Amazon Bedrock Foundation Model for governed financial anomaly explanations

  ContainerImage:
    Type: String
    Default: node:20-slim
    Description: Container image URI for LedgerSense API (from Amazon ECR or public registry)

  DesiredCount:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 10
    Description: Number of active ECS Fargate tasks running behind the ALB

  FargateCpu:
    Type: String
    Default: '512'
    AllowedValues: ['256', '512', '1024', '2048', '4096']
    Description: Amount of vCPU allocated to each Fargate task (512 = 0.5 vCPU)

  FargateMemory:
    Type: String
    Default: '1024'
    AllowedValues: ['512', '1024', '2048', '4096', '8192']
    Description: Amount of RAM (MB) allocated to each Fargate task (1024 = 1 GB)

Resources:
  # ------------------------------------------------------------
  # 1. NETWORKING: VPC, Subnets, Gateway, Route Tables
  # ------------------------------------------------------------
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-vpc'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-igw'

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-public-subnet-1'

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.0.2.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-public-subnet-2'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-public-rt'

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  Subnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  Subnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # ------------------------------------------------------------
  # 2. SECURITY GROUPS
  # ------------------------------------------------------------
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable public HTTP/HTTPS access to ALB
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-alb-sg'

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow inbound ingress from ALB only
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 4000
          ToPort: 4000
          SourceSecurityGroupId: !Ref ALBSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-ecs-sg'

  # ------------------------------------------------------------
  # 3. APPLICATION LOAD BALANCER & TARGET GROUP
  # ------------------------------------------------------------
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${EnvironmentName}-alb'
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-alb'

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${EnvironmentName}-tg'
      Port: 4000
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VPC
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-tg'

  ALBListenerHTTP:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup

  # ------------------------------------------------------------
  # 4. AMAZON S3: Encrypted Bucket for Batch Artifacts & Audits
  # ------------------------------------------------------------
  ReconciliationArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${EnvironmentName}-artifacts-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST, HEAD]
            AllowedOrigins: ['*']
            MaxAge: 3600
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-s3-artifacts'

  # ------------------------------------------------------------
  # 5. AMAZON DYNAMODB: Distributed Idempotency & Run Locks
  # ------------------------------------------------------------
  ReconciliationLocksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${EnvironmentName}-locks'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: lock_id
          AttributeType: S
      KeySchema:
        - AttributeName: lock_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-dynamodb-locks'

  # ------------------------------------------------------------
  # 6. CLOUDWATCH LOG GROUP
  # ------------------------------------------------------------
  ECSLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${EnvironmentName}'
      RetentionInDays: 30

  # ------------------------------------------------------------
  # 7. IAM ROLES (Execution Role + Task Role with Bedrock & S3)
  # ------------------------------------------------------------
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-task-execution-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-task-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        # S3 Access
        - PolicyName: S3ArtifactAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt ReconciliationArtifactBucket.Arn
                  - !Sub '${ReconciliationArtifactBucket.Arn}/*'
        # DynamoDB Lock Access
        - PolicyName: DynamoDBLocksAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                Resource: !GetAtt ReconciliationLocksTable.Arn
        # Amazon Bedrock AI Access (Governed Anomaly Explanations)
        - PolicyName: AmazonBedrockAIAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock:GetFoundationModel
                Resource: '*'
        # CloudWatch Logging
        - PolicyName: CloudWatchLogAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt ECSLogGroup.Arn

  # ------------------------------------------------------------
  # 8. ECS FARGATE CLUSTER, TASK DEFINITION & SERVICE
  # ------------------------------------------------------------
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${EnvironmentName}-cluster'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-cluster'

  ECSTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${EnvironmentName}-task'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref FargateCpu
      Memory: !Ref FargateMemory
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: api-service
          Image: !Ref ContainerImage
          Essential: true
          PortMappings:
            - ContainerPort: 4000
              Protocol: tcp
          Environment:
            - Name: PORT
              Value: '4000'
            - Name: DATABASE_URL
              Value: !Ref DatabaseUrl
            - Name: JWT_SECRET
              Value: !Ref JwtSecret
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: S3_BUCKET_NAME
              Value: !Ref ReconciliationArtifactBucket
            - Name: DYNAMODB_TABLE_NAME
              Value: !Ref ReconciliationLocksTable
            - Name: BEDROCK_MODEL_ID
              Value: !Ref BedrockModelId
            - Name: NODE_ENV
              Value: production
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ECSLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  ECSFargateService:
    Type: AWS::ECS::Service
    DependsOn: ALBListenerHTTP
    Properties:
      ServiceName: !Sub '${EnvironmentName}-service'
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref ECSTaskDefinition
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnet1
            - !Ref PublicSubnet2
          SecurityGroups:
            - !Ref ECSSecurityGroup
      LoadBalancers:
        - ContainerName: api-service
          ContainerPort: 4000
          TargetGroupArn: !Ref ALBTargetGroup

# ------------------------------------------------------------
# 9. STACK OUTPUTS (DNS, Endpoints, Resources)
# ------------------------------------------------------------
Outputs:
  ALBDnsName:
    Description: Application Load Balancer Public DNS Name
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: !Sub '${EnvironmentName}-ALB-DNS'

  WebUIUrl:
    Description: Public URL for Web Client Terminal
    Value: !Sub 'http://${ApplicationLoadBalancer.DNSName}/'

  HealthCheckUrl:
    Description: Microservice Health Check Endpoint
    Value: !Sub 'http://${ApplicationLoadBalancer.DNSName}/api/health'

  CloudStatusUrl:
    Description: AWS Cloud Topology Verification Endpoint
    Value: !Sub 'http://${ApplicationLoadBalancer.DNSName}/api/cloud/status'

  S3ArtifactBucket:
    Description: Amazon S3 Bucket for Financial Batches & Reconciliation Proofs
    Value: !Ref ReconciliationArtifactBucket

  DynamoDBLocksTable:
    Description: Amazon DynamoDB Table for Distributed Mutex & Idempotency
    Value: !Ref ReconciliationLocksTable

  ECSClusterName:
    Description: AWS ECS Cluster Name
    Value: !Ref ECSCluster

  BedrockModelId:
    Description: Amazon Bedrock Foundation Model ID Active for Governed AI
    Value: !Ref BedrockModelId
