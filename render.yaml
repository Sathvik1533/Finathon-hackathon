services:
  # 1. Finathon Node.js API + Static Dashboard Service (1-Click Free Tier Deploy)
  - type: web
    name: finathon-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: cd api && npm install && npm run build
    startCommand: cd api && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_MERCHANT_ID
        value: m_demo_finathon
      # Optional: paste your Upstash or Railway Redis URL.
      # If omitted, the API automatically uses its built-in in-memory fallback.
      - key: REDIS_URL
        sync: false

  # 2. Managed Redis Cache (Optional: Render Redis requires 'starter' plan at $7/mo)
  # Uncomment the block below if you have a paid Render plan:
  # - type: redis
  #   name: finathon-redis
  #   plan: starter
  #   region: oregon
  #   maxmemoryPolicy: allkeys-lru
  #   ipAllowList: []
