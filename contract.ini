; ==============================================================================
; Finathon Authentication & API Contract Specification
; Service: Auth Gateway & Session Management
; Version: 1.0.0
; Architecture: Modular Node.js / Express.js Backend with Next.js Frontend Consumer
; ==============================================================================

[service]
name = "finathon-auth-backend"
version = "1.0.0"
runtime = "Node.js >= 18"
framework = "Express.js 5.x"
port = 5001
base_url = "http://localhost:5001"
api_prefix = "/api/auth"

[database]
engine = "PostgreSQL"
client = "pg (node-postgres)"
default_connection = "postgresql://postgres:postgres@localhost:5432/finathon_db"
fallback_mode = "Embedded in-memory store for instant offline development and zero-config unit tests"
table_users = "users (id SERIAL PRIMARY KEY, name VARCHAR(255) NOT NULL, email VARCHAR(255) UNIQUE NOT NULL, password_hash VARCHAR(255) NOT NULL, created_at TIMESTAMPTZ, updated_at TIMESTAMPTZ)"

[security]
auth_type = "Bearer Token (JSON Web Token)"
token_algorithm = "HS256"
token_expiry = "7d"
password_hashing = "bcrypt (salt rounds = 10)"
cors_policy = "Enabled (allow all origin headers in development)"

; ------------------------------------------------------------------------------
; API Endpoints Specification
; ------------------------------------------------------------------------------

[endpoint.health]
method = "GET"
path = "/api/health"
auth_required = false
description = "Service health check and timestamp probe"
response_success = 200
response_schema = "{ \"status\": \"healthy\", \"service\": \"finathon-auth-backend\", \"version\": \"1.0.0\", \"timestamp\": \"ISO8601\" }"

[endpoint.register]
method = "POST"
path = "/api/auth/register"
auth_required = false
content_type = "application/json"
description = "Creates a new user account with hashed password and issues initial JWT token"
request_body_name = "string (min: 2, max: 100, required)"
request_body_email = "string (valid email format, required)"
request_body_password = "string (min: 8 characters, required)"
response_success = 201
response_success_schema = "{ \"success\": true, \"message\": \"Account created successfully!\", \"token\": \"<jwt_token>\", \"user\": { \"id\": 1, \"name\": \"...\", \"email\": \"...\" } }"
response_conflict = 409
response_conflict_message = "An account with this email address already exists."
response_validation_error = 400

[endpoint.login]
method = "POST"
path = "/api/auth/login"
auth_required = false
content_type = "application/json"
description = "Validates user credentials against database hash and returns session JWT token"
request_body_email = "string (valid email, required)"
request_body_password = "string (required)"
response_success = 200
response_success_schema = "{ \"success\": true, \"message\": \"Login successful!\", \"token\": \"<jwt_token>\", \"user\": { \"id\": 1, \"name\": \"...\", \"email\": \"...\" } }"
response_unauthorized = 401
response_unauthorized_message = "Invalid email or password."
response_validation_error = 400

[endpoint.me]
method = "GET"
path = "/api/auth/me"
auth_required = true
header_authorization = "Bearer <jwt_token>"
description = "Validates the JWT token and returns currently authenticated user profile"
response_success = 200
response_success_schema = "{ \"success\": true, \"user\": { \"id\": 1, \"name\": \"...\", \"email\": \"...\" } }"
response_unauthorized_missing = 401
response_unauthorized_invalid = 401
response_unauthorized_expired = 401

[endpoint.logout]
method = "POST"
path = "/api/auth/logout"
auth_required = true
header_authorization = "Bearer <jwt_token>"
description = "Notifies server of user logout; client removes token from local storage"
response_success = 200
response_success_schema = "{ \"success\": true, \"message\": \"Successfully logged out.\" }"

; ------------------------------------------------------------------------------
; Next.js Frontend Integration Contract
; ------------------------------------------------------------------------------

[frontend.nextjs]
client_framework = "Next.js (App Router or Pages Router)"
env_variable_backend_url = "NEXT_PUBLIC_API_URL=http://localhost:5001"
session_storage = "localStorage / HTTP-only Cookie"
header_name = "Authorization"
header_value_format = "Bearer ${token}"
recommended_client = "fetch API or Axios with request interceptor"
state_management = "React Context (AuthContext) or Zustand"
protected_routes = "middleware.ts with cookie or client-side useAuth() guard"
ready_for_screen_2 = true
