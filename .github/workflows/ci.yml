name: CI Pipeline

on:
  push:
    branches: [ main, master, develop, auth ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  lint-and-validate:
    name: Lint & Structure Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install Validation & Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML flake8

      - name: Validate Workflow YAML Files
        run: |
          python -c "
          import yaml, glob, sys
          yaml_files = glob.glob('.github/workflows/*.yml') + glob.glob('.github/workflows/*.yaml')
          errors = 0
          for yf in yaml_files:
              try:
                  with open(yf, 'r') as f:
                      yaml.safe_load(f)
                  print(f'✓ Valid YAML: {yf}')
              except Exception as e:
                  print(f'✗ Invalid YAML: {yf}: {e}', file=sys.stderr)
                  errors += 1
          if errors > 0:
              sys.exit(1)
          print(f'All {len(yaml_files)} workflow files validated successfully.')
          "

      - name: Lint Python Code (Flake8)
        run: |
          # Check for Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.git,__pycache__,venv,.venv,node_modules
          
          # Report warnings with exit-zero for non-blocking style guidance
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics --exclude=.git,__pycache__,venv,.venv,node_modules

      - name: Check for Uncommitted Sensitive Files
        run: |
          echo "Scanning for sensitive files that should not be tracked..."
          BLOCKED_PATTERNS=("\.env$" "\.env\." "\.pem$" "\.key$" "id_rsa" "credentials\.json$")
          LEAK_FOUND=0
          for pattern in "${BLOCKED_PATTERNS[@]}"; do
            if git ls-files | grep -E "$pattern" 2>/dev/null; then
              echo "SECURITY ERROR: Sensitive file matching pattern '$pattern' found tracked in git!"
              LEAK_FOUND=1
            fi
          done
          if [ $LEAK_FOUND -ne 0 ]; then
            exit 1
          fi
          echo "✓ No sensitive credentials or environment files tracked in git."

  test-python:
    name: Python Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install pytest pytest-cov
          fi

      - name: Run Pytest Test Suite with Coverage
        run: |
          if [ -d tests ] || ls test_*.py 1>/dev/null 2>&1; then
            pytest -v --tb=short --durations=10
          else
            echo "No test directory found yet; running baseline smoke validation."
            python -c "print('Baseline runtime validation passed on Python ${{ matrix.python-version }}')"
          fi

  test-node:
    name: Node.js Test Suite (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18.x", "20.x", "22.x"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Node.js Project
        id: check_node
        run: |
          if [ -f package.json ]; then
            echo "has_node=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_node=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js ${{ matrix.node-version }}
        if: steps.check_node.outputs.has_node == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install Node Dependencies
        if: steps.check_node.outputs.has_node == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Node Linter
        if: steps.check_node.outputs.has_node == 'true'
        run: |
          if npm run | grep -q "lint"; then
            npm run lint
          fi

      - name: Run Node Tests
        if: steps.check_node.outputs.has_node == 'true'
        run: |
          if npm run | grep -q "test"; then
            npm test
          fi

      - name: Run Node Build
        if: steps.check_node.outputs.has_node == 'true'
        run: |
          if npm run | grep -q "build"; then
            npm run build
          fi

      - name: Skip Notification
        if: steps.check_node.outputs.has_node == 'false'
        run: |
          echo "No package.json detected; skipping Node.js matrix test."

  security-audit:
    name: Security & Vulnerability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Python Dependency Audit
        run: |
          if [ -f requirements.txt ]; then
            pip install pip-audit
            pip-audit -r requirements.txt || echo "::warning::pip-audit reported advisories on requirements.txt"
          else
            echo "No requirements.txt found; skipping pip-audit."
          fi

      - name: Run NPM Security Audit
        run: |
          if [ -f package.json ]; then
            npm audit --audit-level=high || echo "::warning::npm audit reported high severity advisories"
          else
            echo "No package.json found; skipping npm audit."
          fi

  ci-gate:
    name: CI Pipeline Gate
    needs: [lint-and-validate, test-python, test-node, security-audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Pipeline Status
        run: |
          LINT="${{ needs.lint-and-validate.result }}"
          PYTEST="${{ needs.test-python.result }}"
          NODE="${{ needs.test-node.result }}"
          SECURITY="${{ needs.security-audit.result }}"
          
          echo "Pipeline results summary:"
          echo "  - lint-and-validate: $LINT"
          echo "  - test-python: $PYTEST"
          echo "  - test-node: $NODE"
          echo "  - security-audit: $SECURITY"
          
          if [ "$LINT" != "success" ] || [ "$PYTEST" != "success" ] || [ "$NODE" != "success" ] || [ "$SECURITY" != "success" ]; then
            echo "ERROR: One or more CI stages failed or did not succeed!"
            exit 1
          fi
          
          echo "✓ All CI stages completed successfully. Gate is GREEN."
