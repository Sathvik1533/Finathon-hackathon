services:
  # 1. Finathon Node.js API + Static Dashboard Service
  - type: web
    name: finathon-api
    runtime: node
    plan: free
    region: oregon
    rootDir: api
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_MERCHANT_ID
        value: m_demo_finathon
      - key: REDIS_URL
        fromService:
          type: redis
          name: finathon-redis
          property: connectionString

  # 2. Internal Redis Cache & Mutex Store
  - type: redis
    name: finathon-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
