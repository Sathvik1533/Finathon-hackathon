<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finathon - Authentication</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <!-- Brand Header -->
      <div class="brand-header">
        <div class="brand-logo">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
        <h1 id="form-title">Welcome back</h1>
        <p id="form-subtitle">Please enter your details to sign in</p>
      </div>

      <!-- Tab Switcher -->
      <div class="tabs-container" id="tabs-wrapper" role="tablist">
        <button type="button" class="tab-btn active" id="tab-login" role="tab" aria-selected="true" aria-controls="login-form">Sign In</button>
        <button type="button" class="tab-btn" id="tab-signup" role="tab" aria-selected="false" aria-controls="signup-form">Sign Up</button>
      </div>

      <!-- Notification Banner -->
      <div id="alert-banner" class="alert hidden" role="alert"></div>

      <!-- Auth Forms Wrapper -->
      <div id="auth-forms-container">
        <!-- Sign In Form -->
        <form id="login-form" class="auth-form" novalidate>
          <div class="form-group">
            <label for="login-email">Email Address</label>
            <div class="input-wrapper">
              <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="20" height="16" x="2" y="4" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
              <input 
                type="email" 
                id="login-email" 
                name="email" 
                placeholder="name@example.com" 
                required 
                autocomplete="email"
              >
            </div>
            <span class="field-error" id="login-email-error"></span>
          </div>

          <div class="form-group">
            <div class="label-row">
              <label for="login-password">Password</label>
              <a href="#" class="forgot-link" id="forgot-password-link">Forgot password?</a>
            </div>
            <div class="input-wrapper">
              <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input 
                type="password" 
                id="login-password" 
                name="password" 
                placeholder="••••••••" 
                required 
                autocomplete="current-password"
              >
              <button type="button" class="toggle-password" aria-label="Toggle password visibility" data-target="login-password">
                <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="eye-closed hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m15 18-.722-3.25"/>
                  <path d="M2 8a10.645 10.645 0 0 0 20 0"/>
                  <path d="m20 15-1.726-2.05"/>
                  <path d="m4 15 1.726-2.05"/>
                  <path d="m9 18 .722-3.25"/>
                </svg>
              </button>
            </div>
            <span class="field-error" id="login-password-error"></span>
          </div>

          <div class="form-options">
            <label class="checkbox-container">
              <input type="checkbox" id="remember-me">
              <span class="checkmark"></span>
              <span class="checkbox-label">Remember me for 30 days</span>
            </label>
          </div>

          <button type="submit" class="submit-btn" id="login-btn">
            <span class="btn-text">Sign In</span>
            <span class="btn-loader hidden"></span>
          </button>
        </form>

        <!-- Sign Up Form (hidden by default) -->
        <form id="signup-form" class="auth-form hidden" novalidate>
          <div class="form-group">
            <label for="signup-name">Full Name</label>
            <div class="input-wrapper">
              <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="7" r="4"/>
                <path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>
              </svg>
              <input 
                type="text" 
                id="signup-name" 
                name="name" 
                placeholder="Alex Johnson" 
                required 
                autocomplete="name"
              >
            </div>
            <span class="field-error" id="signup-name-error"></span>
          </div>

          <div class="form-group">
            <label for="signup-email">Email Address</label>
            <div class="input-wrapper">
              <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="20" height="16" x="2" y="4" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
              <input 
                type="email" 
                id="signup-email" 
                name="email" 
                placeholder="name@example.com" 
                required 
                autocomplete="email"
              >
            </div>
            <span class="field-error" id="signup-email-error"></span>
          </div>

          <div class="form-group">
            <label for="signup-password">Password</label>
            <div class="input-wrapper">
              <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input 
                type="password" 
                id="signup-password" 
                name="password" 
                placeholder="At least 8 characters" 
                required 
                autocomplete="new-password"
              >
              <button type="button" class="toggle-password" aria-label="Toggle password visibility" data-target="signup-password">
                <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="eye-closed hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m15 18-.722-3.25"/>
                  <path d="M2 8a10.645 10.645 0 0 0 20 0"/>
                  <path d="m20 15-1.726-2.05"/>
                  <path d="m4 15 1.726-2.05"/>
                  <path d="m9 18 .722-3.25"/>
                </svg>
              </button>
            </div>
            <span class="field-error" id="signup-password-error"></span>
          </div>

          <div class="form-options">
            <label class="checkbox-container">
              <input type="checkbox" id="terms-agree" required>
              <span class="checkmark"></span>
              <span class="checkbox-label">I agree to the <a href="#" class="inline-link">Terms</a> and <a href="#" class="inline-link">Privacy Policy</a></span>
            </label>
          </div>

          <button type="submit" class="submit-btn" id="signup-btn">
            <span class="btn-text">Create Account</span>
            <span class="btn-loader hidden"></span>
          </button>
        </form>

        <!-- Divider -->
        <div class="divider">
          <span>or continue with</span>
        </div>

        <!-- Social Logins -->
        <div class="social-login-grid">
          <button type="button" class="social-btn" id="google-btn" title="Sign in with Google">
            <svg width="20" height="20" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17Z"/>
              <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24Z"/>
              <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.17 0 9.99 0 12s.45 3.83 1.25 5.42l4.03-3.15Z"/>
              <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98Z"/>
            </svg>
            <span>Google</span>
          </button>

          <button type="button" class="social-btn" id="github-btn" title="Sign in with GitHub">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0 0 22 12.017C22 6.484 17.522 2 12 2Z"/>
            </svg>
            <span>GitHub</span>
          </button>
        </div>

        <!-- Footer Info -->
        <p class="auth-footer-text" id="toggle-footer-prompt">
          Don't have an account? <a href="#" id="switch-to-signup">Sign up for free</a>
        </p>
      </div>

      <!-- Authenticated User Screen (shown when JWT is verified) -->
      <div id="authenticated-screen" class="hidden">
        <div class="user-profile-badge">
          <div class="avatar-circle" id="user-avatar">U</div>
          <div class="user-info">
            <h3 id="display-user-name">User Name</h3>
            <p id="display-user-email">user@example.com</p>
          </div>
        </div>

        <div class="token-status-card">
          <div class="status-indicator-row">
            <span class="status-dot online"></span>
            <span class="status-label">JWT Session: <strong>Active & Verified</strong></span>
          </div>
          <div class="token-meta">
            <span class="meta-label">User ID:</span>
            <span class="meta-value" id="display-user-id">#1</span>
          </div>
          <div class="token-meta">
            <span class="meta-label">Token Expiry:</span>
            <span class="meta-value">7 Days</span>
          </div>
        </div>

        <div class="dashboard-actions">
          <button type="button" class="submit-btn next-screen-btn" id="next-screen-btn">
            <span>Proceed to Next Screen ➔</span>
          </button>
          <button type="button" class="logout-btn" id="logout-btn">
            <span>Sign Out</span>
          </button>
        </div>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
